<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="UNISON SQUARE GARDENの曲名・収録作品・キー・BPMを検索できます。販売中のギターTABはPiascoreで確認できます。">
  <link rel="canonical" href="https://hatosan-lab.github.io/music-tab-portal/tabs/unison/">
  <meta property="og:title" content="UNISON SQUARE GARDEN ギターTAB・BPM・キー一覧 | Hatosan Music Lab">
  <meta property="og:description" content="UNISON SQUARE GARDENの曲名・収録作品・キー・BPMを検索できます。販売中のギターTABはPiascoreで確認できます。">
  <meta property="og:url" content="https://hatosan-lab.github.io/music-tab-portal/tabs/unison/">
  <meta property="og:type" content="website">
  <title>UNISON SQUARE GARDEN ギターTAB・BPM・キー一覧 | Hatosan Music Lab</title>
  <link rel="stylesheet" href="../../assets/styles.css">
</head>
<body data-data-url="../../data/songs.json" data-artist="UNISON SQUARE GARDEN">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../../">Hatosan Music Lab</a>
      <nav class="top-nav" aria-label="メインナビゲーション">
        <a href="../unison/" aria-current="page">UNISON</a>
        <a href="../aooo/">Aooo</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">ARTIST CATALOG</p>
      <h1>UNISON SQUARE GARDEN</h1>
      <p>曲名・収録作品・キー・BPMから楽曲情報を検索できます。販売中のTABはギターTABで、各曲からPiascoreで確認できます。コピー前の情報確認にも使えます。</p>
    </section>
    <section class="catalog">
      <div class="catalog-heading">
        <h2>楽曲一覧</h2>
        <p id="resultCount" class="result-count" aria-live="polite">読み込み中</p>
      </div>
      <div class="filters" aria-label="楽曲の絞り込み">
        <div class="field">
          <label for="searchInput">検索</label>
          <input id="searchInput" type="search" placeholder="曲名・作品名・キー・BPM" autocomplete="off">
        </div>
        <div class="field">
          <label for="keyFilter">主キー</label>
          <select id="keyFilter"><option value="">すべて</option></select>
        </div>
        <div class="field">
          <label for="yearFilter">リリース年</label>
          <select id="yearFilter"><option value="">すべて</option></select>
        </div>
        <div class="field">
          <label for="syncFilter">同期音源</label>
          <select id="syncFilter">
            <option value="">すべて</option>
            <option value="yes">あり</option>
            <option value="no">なし</option>
          </select>
        </div>
        <div class="field">
          <label for="sortSelect">並び順</label>
          <select id="sortSelect">
            <option value="year-desc">新しい順</option>
            <option value="title">曲名順</option>
            <option value="bpm">BPM順</option>
          </select>
        </div>
        <div class="checkbox-field">
          <label class="checkbox-label"><input id="tabOnly" type="checkbox">ギターTAB販売中のみ</label>
        </div>
      </div>
      <div id="songGrid" class="song-grid" aria-live="polite"></div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-inner"><a href="../../">全楽曲へ戻る</a> · <a href="../aooo/">Aoooを見る</a></div>
  </footer>
  <script src="../../assets/app.js" defer></script>
</body>
</html>
