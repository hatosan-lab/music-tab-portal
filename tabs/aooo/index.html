<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aoooの楽曲情報・ギターTAB一覧。">
  <title>Aooo | Hatosan Music Lab</title>
  <link rel="stylesheet" href="../../assets/styles.css">
</head>
<body data-data-url="../../data/songs.json" data-artist="Aooo">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../../">Hatosan Music Lab</a>
      <nav class="top-nav" aria-label="メインナビゲーション">
        <a href="../unison/">UNISON</a>
        <a href="../aooo/" aria-current="page">Aooo</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">ARTIST CATALOG</p>
      <h1>Aooo</h1>
      <p>楽曲情報と販売中TABを検索・絞り込みできます。未確認の情報は表示していません。</p>
    </section>
    <section class="catalog">
      <div class="catalog-heading">
        <h2>楽曲一覧</h2>
        <p id="resultCount" class="result-count" aria-live="polite">読み込み中</p>
      </div>
      <div class="filters" aria-label="楽曲の絞り込み">
        <div class="field">
          <label for="searchInput">検索</label>
          <input id="searchInput" type="search" placeholder="曲名・作品名・キー・BPM" autocomplete="off">
        </div>
        <div class="field">
          <label for="keyFilter">主キー</label>
          <select id="keyFilter"><option value="">すべて</option></select>
        </div>
        <div class="field">
          <label for="sortSelect">並び順</label>
          <select id="sortSelect">
            <option value="year-desc">新しい順</option>
            <option value="title">曲名順</option>
            <option value="bpm">BPM順</option>
          </select>
        </div>
        <div class="checkbox-field">
          <label class="checkbox-label"><input id="tabOnly" type="checkbox">TAB販売中のみ</label>
        </div>
      </div>
      <div id="songGrid" class="song-grid" aria-live="polite"></div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-inner"><a href="../../">全楽曲へ戻る</a> · <a href="../unison/">UNISONを見る</a></div>
  </footer>
  <script src="../../assets/app.js" defer></script>
</body>
</html>
